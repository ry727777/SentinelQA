
name: SentinelQA Test Automation

# ============================================================================
# TRIGGERS: Define when this workflow should execute
# ============================================================================
on:
  # Trigger on any push to the main branch
  push:
    branches:
      - main

  # Trigger on any pull request targeting the main branch
  pull_request:
    branches:
      - main

  # Allow manual execution of the workflow via GitHub Actions UI
  workflow_dispatch:

# ============================================================================
# ENVIRONMENT VARIABLES: Available throughout the workflow
# ============================================================================
env:
  # Java version to use (should match pom.xml compiler version)
  JAVA_VERSION: '17'
  # Maven distribution version
  MAVEN_VERSION: '3.8.7'
  # Temurin JDK provider for reliable Java installation
  JDK_VENDOR: 'temurin'

# ============================================================================
# PERMISSIONS: Limit workflow permissions for security
# ============================================================================
# Note: Individual jobs can override these permissions as needed
permissions:
  # Read-only access to repository contents
  contents: read
  # Write permission for GitHub Pages deployment
  pages: write
  # Token permission for GitHub Pages
  id-token: write

# ============================================================================
# CONCURRENCY: Prevent multiple workflow runs on GitHub Pages
# ============================================================================
# This ensures only one deployment happens at a time to GitHub Pages
concurrency:
  # Group deployments by "pages" to ensure only one at a time
  group: "pages"
  # Cancel in-progress deployments when a new one starts
  cancel-in-progress: true

# ============================================================================
# JOBS: Define the work to be executed
# ============================================================================
jobs:
  # Main job for building and testing the automation framework
  test-automation:
    # Use the latest Ubuntu runner for consistency and latest dependencies
    runs-on: ubuntu-latest

    # ========================================================================
    # STEPS: Sequential tasks executed in the job
    # ========================================================================
    steps:
      # ====================================================================
      # Step 1: Checkout the repository code
      # ====================================================================
      - name: 📋 Checkout Repository
        uses: actions/checkout@v4
        with:
          # Fetch full history for better git operations
          fetch-depth: 0

      # ====================================================================
      # Step 2: Set up Java 17 with Temurin JDK
      # ====================================================================
      - name: 🔧 Set up Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          # Specify Java version matching pom.xml configuration
          java-version: ${{ env.JAVA_VERSION }}
          # Use Temurin JDK for reliable, open-source Java distribution
          distribution: ${{ env.JDK_VENDOR }}
          # Enable Maven toolchain for build consistency
          cache: maven

      # ====================================================================
      # Step 3: Cache Maven dependencies to speed up builds
      # ====================================================================
      - name: 📦 Cache Maven Dependencies
        uses: actions/cache@v4
        with:
          # Cache Maven repository
          path: ~/.m2/repository
          # Cache key based on pom.xml hash for invalidation on dependency changes
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          # Fallback to any previous cache if exact key not found
          restore-keys: |
            ${{ runner.os }}-maven-

      # ====================================================================
      # Step 4: Configure environment variables for API keys
      # ====================================================================
      # These secrets must be configured in GitHub repository settings:
      # Settings → Secrets and variables → Actions → New repository secret
      # ====================================================================
      - name: 🔑 Configure Environment Variables
        run: |
          # Export GEMINI_API_KEY from GitHub repository secret
          # Maps to OPENAI_API_KEY secret for backward compatibility
          # Java apps can access via: System.getenv("GEMINI_API_KEY")
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> $GITHUB_ENV
          
          # Export REQRES_API_KEY from GitHub repository secret
          # For REST API testing with ReqRes service
          # Java apps can access via: System.getenv("REQRES_API_KEY")
          echo "REQRES_API_KEY=${{ secrets.REQRES_API_KEY }}" >> $GITHUB_ENV
          
          # Verify environment variables are configured (without printing sensitive values)
          echo "✓ GEMINI_API_KEY configured"
          echo "✓ REQRES_API_KEY configured"

      # ====================================================================
      # Step 5: Display Java and Maven versions (diagnostic information)
      # ====================================================================
      - name: ℹ️ Display Java and Maven Versions
        run: |
          echo "Java Version:"
          java -version
          echo ""
          echo "Maven Version:"
          mvn -version

      # ====================================================================
      # Step 6: Clean and compile the project
      # ====================================================================
      - name: 🔨 Clean and Compile Project
        run: |
          # Remove previous build artifacts and compile the project
          # This step validates Java syntax and dependencies
          mvn clean compile \
            -DskipTests \
            -B \
            -V
        # If compilation fails, the workflow stops and reports the error
        continue-on-error: false

      # ====================================================================
      # Step 7: Execute all tests (UI and API tests via TestNG)
      # ====================================================================
      - name: 🧪 Run Tests
        run: |
          # Execute TestNG test suite configured in testng.xml
          # -B: Batch mode (no interactive input)
          # -V: Verbose output for debugging
          # -DskipTests=false: Ensure tests are executed
          mvn test \
            -B \
            -V
        # Continue even if tests fail so we can collect test reports
        # Failure is handled by the artifact upload step
        continue-on-error: true
        env:
          # Make OPENAI_API_KEY available to the Java tests
          OPENAI_API_KEY: ${{ env.OPENAI_API_KEY }}

      # ====================================================================
      # Step 8: Upload test reports and logs as workflow artifacts
      # ====================================================================
      - name: 📊 Upload Test Reports and Artifacts
        # Execute this step even if previous steps failed (crucial for debugging failed tests)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # Descriptive name for the artifact in GitHub Actions UI
          name: test-reports-and-logs-${{ github.run_id }}
          # Paths containing test reports and logs to upload
          path: |
            test-output/
            reports/
            target/surefire-reports/
            allure-results/
          # Set to warn if artifact files are not found (don't fail the job)
          if-no-files-found: warn
          # Retain artifacts for 30 days (GitHub default)
          retention-days: 30

      # ====================================================================
      # Step 9 (NEW): Verify Allure results directory exists
      # ====================================================================
      - name: ✅ Verify Allure Results
        if: always()
        run: |
          echo "🔍 Checking Allure results..."
          if [ -d "allure-results" ]; then
            echo "✓ allure-results directory found"
            echo "  Contents:"
            ls -lh allure-results/ | head -10
          else
            echo "⚠️  allure-results directory not found (tests may have failed or no Allure annotations)"
          fi
          echo ""
          echo "📊 TestNG reports location:"
          if [ -d "target/surefire-reports" ]; then
            echo "✓ target/surefire-reports found"
            ls -lh target/surefire-reports/ | head -5
          fi

      # ====================================================================
      # Step 9: Generate Allure test report
      # ====================================================================
      - name: 📈 Generate Allure Report
        if: always()
        run: |
          # Build Allure report from test results in allure-results directory
          # Report generates to: target/site/allure-maven-plugin/
          # This provides a detailed interactive dashboard for test analysis
          # -B: Batch mode (no interactive input)
          # -V: Verbose output for debugging
          mvn allure:report -B -V || echo "⚠️  Allure report generation had issues, but continuing..."
        continue-on-error: true
        timeout-minutes: 10

      # ====================================================================
      # Step 10: Upload Allure HTML report as artifact
      # ====================================================================
      - name: 📤 Upload Allure HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # Descriptive name for the artifact
          name: allure-html-report-${{ github.run_id }}
          # Correct path where Allure Maven plugin generates the HTML report
          # Generated by: mvn allure:report
          # Location: target/site/allure-maven-plugin/index.html
          path: target/site/allure-maven-plugin/
          if-no-files-found: warn
          retention-days: 30

      # ====================================================================
      # Step 12 (was 11): Generate workflow summary with test results
      # ====================================================================
      - name: 📝 Generate Workflow Summary
        if: always()
        run: |
          echo "## Test Automation Workflow Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Environment Details" >> $GITHUB_STEP_SUMMARY
          echo "- **Java Version**: $(java -version 2>&1 | head -1)" >> $GITHUB_STEP_SUMMARY
          echo "- **Maven Version**: $(mvn -version | head -1)" >> $GITHUB_STEP_SUMMARY
          echo "- **Runner**: ${{ runner.os }} (${{ runner.arch }})" >> $GITHUB_STEP_SUMMARY
          echo "- **Workflow Trigger**: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Test Artifact Locations" >> $GITHUB_STEP_SUMMARY
          echo "- **TestNG Reports**: \`target/surefire-reports/\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Allure Results**: \`allure-results/\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Allure HTML Report**: \`target/site/allure-maven-plugin/index.html\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Test Output**: \`test-output/\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### How to View Reports" >> $GITHUB_STEP_SUMMARY
          echo "1. Download **allure-html-report-** artifact" >> $GITHUB_STEP_SUMMARY
          echo "2. Extract the ZIP file" >> $GITHUB_STEP_SUMMARY
          echo "3. Open \`allure-maven-plugin/index.html\` in your browser" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "1. Review test failures in the workflow summary" >> $GITHUB_STEP_SUMMARY
          echo "2. Check Allure HTML report for detailed insights" >> $GITHUB_STEP_SUMMARY
          echo "3. Check logs for detailed error information" >> $GITHUB_STEP_SUMMARY

  # ========================================================================
  # Job 2: Deploy Allure Report to GitHub Pages
  # ========================================================================
  # This job deploys the Allure HTML report to GitHub Pages for easy viewing
  # Requirements:
  # - GitHub Pages must be enabled in repository settings
  # - Deploy from 'gh-pages' branch (auto-created by actions/deploy-pages)
  # - Runs after test-automation job completes
  deploy-report:
    name: 🚀 Deploy Allure Report
    
    # Wait for test-automation job to complete before running
    needs: test-automation
    
    # Run even if test-automation has failures (always deploy report for analysis)
    if: always()
    
    # Use latest Ubuntu runner
    runs-on: ubuntu-latest
    
    # ====================================================================
    # PERMISSIONS: Required to deploy to GitHub Pages
    # ====================================================================
    permissions:
      # Write permission for GitHub Pages
      pages: write
      # Token for GitHub Pages deployment
      id-token: write
    
    # ====================================================================
    # ENVIRONMENT: Configure GitHub Pages deployment environment
    # ====================================================================
    environment:
      # Deploy to github-pages environment
      name: github-pages
      # URL where the report will be accessible
      url: ${{ steps.deployment.outputs.page_url }}
    
    # ====================================================================
    # STEPS: Deploy Allure report to GitHub Pages
    # ====================================================================
    steps:
      # ====================================================================
      # Step 1: Download Allure HTML Report Artifact
      # ====================================================================
      - name: 📥 Download Allure HTML Report
        uses: actions/download-artifact@v4
        with:
          # Use the artifact name from test-automation job
          name: allure-html-report-${{ github.run_id }}
          # Download to ./site (GitHub Pages root directory)
          path: ./site
      
      # ====================================================================
      # Step 2: Configure GitHub Pages
      # ====================================================================
      - name: ⚙️ Configure GitHub Pages
        uses: actions/configure-pages@v5
      
      # ====================================================================
      # Step 3: Upload Pages Artifact
      # ====================================================================
      - name: 📤 Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Path containing the static site to deploy
          # GitHub will use this to deploy to github-pages branch
          path: ./site
      
      # ====================================================================
      # Step 4: Deploy to GitHub Pages
      # ====================================================================
      - name: 🌐 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4